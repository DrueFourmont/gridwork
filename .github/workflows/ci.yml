name: ci

on:
  push:
    branches: [main]
  pull_request:

# A new push to the same branch cancels the run already in flight. Saves
# minutes and stops a stale run reporting after a fresh one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  jvm:
    name: jvm build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: set up jdk 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: set up gradle
        # Caches ~/.gradle/caches and the configuration cache, keyed on the
        # build files, and validates the committed wrapper jar against the
        # published checksums so a tampered wrapper cannot execute here.
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: build
        # Runs unit tests and the Testcontainers integration test. GitHub
        # hosted Ubuntu runners ship a working Docker daemon, which is what
        # Testcontainers needs.
        run: ./gradlew build --no-daemon

      - name: upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: jvm-test-reports
          path: "**/build/reports/tests/"
          retention-days: 7

  web:
    name: web typecheck, lint, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5

      - name: set up node 22
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test
      - run: npm run build

  e2e:
    name: playwright smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: set up node 22
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: install web dependencies
        run: npm ci
        working-directory: web

      - name: install playwright chromium
        run: npx playwright install --with-deps chromium
        working-directory: web

      - name: start postgres, redis, localstack, and the api
        # --wait blocks until every service healthcheck passes, so the smoke
        # test never races the API's startup.
        run: docker compose up -d --wait

      - name: show api health
        # Block scalar, not a plain one. "X-Request-Id: ci-smoke" contains a
        # colon followed by a space, which YAML reads as a nested mapping in a
        # plain scalar and makes the whole workflow file unparseable.
        run: |
          curl -isS -H 'X-Request-Id: ci-smoke' http://localhost:8080/actuator/health

      - name: run the smoke test
        # playwright.config.ts starts `vite preview` itself, so this exercises
        # the production bundle, not the dev server.
        run: npx playwright test
        working-directory: web

      - name: api logs on failure
        if: failure()
        run: docker compose logs api

      - name: upload playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 7

      - name: stop everything
        if: always()
        run: docker compose down -v

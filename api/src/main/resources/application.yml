# Gridwork API configuration.
#
# Every secret and every environment specific value is read from an
# environment variable. Nothing sensitive is written here, and nothing
# sensitive is logged. Variable names match .env.example exactly.
#
# Two profiles:
#   local  defaults that point at docker compose, human readable logs
#   prod   no defaults at all, so a missing variable fails at startup
#          rather than silently connecting somewhere unintended

spring:
  application:
    name: gridwork-api

  # Graceful shutdown: on SIGTERM the server stops accepting new connections
  # and lets in flight requests finish before the JVM exits. Kubernetes sends
  # SIGTERM before it kills a pod, so this is what makes a rolling deploy
  # zero downtime rather than a burst of dropped requests.
  lifecycle:
    timeout-per-shutdown-phase: 25s

  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USER}
    password: ${DATABASE_PASSWORD}
    hikari:
      pool-name: gridwork-pool
      maximum-pool-size: 10

  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema. Hibernate never alters it.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          batch_size: 100

  data:
    redis:
      url: ${REDIS_URL}

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

server:
  port: 8080
  shutdown: graceful
  error:
    whitelabel:
      enabled: false

management:
  endpoints:
    web:
      exposure:
        # Nothing beyond these three. env, beans, and heapdump stay closed.
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        # Splits health into two groups Kubernetes understands.
        # liveness  : is the JVM wedged, restart the pod
        # readiness : can this pod take traffic right now, pull it from the
        #             load balancer if not, but do not restart it
        enabled: true
      show-details: when-authorized
      group:
        liveness:
          include: livenessState
        readiness:
          # Redis is in readiness from Phase 3 on. A replica that cannot reach
          # Redis can still serve reads and writes, but it cannot deliver live
          # updates, so it should not be sent new traffic while a healthy
          # replica exists.
          include: readinessState,db,redis
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  metrics:
    tags:
      application: gridwork-api

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

gridwork:
  version: 0.1.0-SNAPSHOT
  jwt:
    # The secret is never written here. It comes from the environment, and the
    # application refuses to start if it is shorter than 32 bytes, because
    # HS256 with a short key is a weakness that never announces itself.
    secret: ${JWT_SECRET}
    issuer: gridwork
    # Short lived on purpose. There is no refresh token and no revocation list,
    # so the expiry is the only thing that limits the damage of a leaked token.
    ttl: 15m
  websocket:
    # No default. A wrong value here silently accepts sockets from any page on
    # the internet, so it has to be stated.
    allowed-origins: ${WEBSOCKET_ALLOWED_ORIGINS}
  sqs:
    # The API is the outbox relay: it publishes committed events to the queue.
    # With no queue url the relay keeps the events instead of discarding them,
    # so a misconfiguration delays automations rather than losing them.
    endpoint: ${SQS_ENDPOINT:}
    queue-url: ${SQS_QUEUE_URL:}
    region: ${AWS_REGION:us-west-2}
  outbox:
    relay:
      enabled: ${GRIDWORK_OUTBOX_RELAY_ENABLED:true}
      interval: 1000
      # One hundred events per pass, every second, from every replica. Raise
      # this together with the SQS batch size if the outbox starts growing
      # faster than it drains under load.
      batch-size: 100

---
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/gridwork}
    username: ${DATABASE_USER:gridwork}
    password: ${DATABASE_PASSWORD:gridwork}
  data:
    redis:
      url: ${REDIS_URL:redis://localhost:6379}

gridwork:
  jwt:
    # A visible, obviously fake development default so `make api` runs with no
    # .env file. Any real deployment sets JWT_SECRET. The prod profile has no
    # default at all, so a missing secret there fails at startup.
    secret: ${JWT_SECRET:local-development-only-secret-not-for-any-real-use}
  websocket:
    # The Vite dev server and the preview server Playwright runs against.
    # 5174 is the second Vite server used when recording the two replica clip.
    allowed-origins: ${WEBSOCKET_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:4173}

management:
  endpoint:
    health:
      # Local only. Lets curl see which components are down without auth.
      show-details: always

logging:
  level:
    com.dfsystems.gridwork: DEBUG

---
spring:
  config:
    activate:
      on-profile: prod

# No defaults in prod on purpose. If DATABASE_URL is unset the application
# refuses to start instead of falling back to something local.

logging:
  level:
    root: INFO
